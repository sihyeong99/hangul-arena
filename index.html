<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>점곡 한글 대결장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2340; --paper:#fffdf5; --sun:#ffc824; --hot:#ff4f6e; --muted:#5d6685; --A:#2f7bf0; --B:#e8384f;
  --display:"Jua","Malgun Gothic",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#8fd8ff;overflow:hidden;font-family:var(--display);font-weight:400;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
button{font-family:var(--display);font-weight:400;color:var(--ink);cursor:pointer;border:3px solid var(--ink);background:#fff;border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:9px 14px;font-size:17px;transition:transform .06s,box-shadow .06s;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.go{background:var(--sun);font-size:22px;padding:12px 22px}
.emo{font-family:var(--emoji)}

/* 로비 */
#lobby{position:fixed;top:0;right:0;bottom:0;width:min(540px,60vw);background:var(--paper);border-left:5px solid var(--ink);padding:16px 18px 18px;overflow-y:auto;z-index:20;display:flex;flex-direction:column;gap:12px}
#lobby h1{font-size:38px;line-height:1.05;margin:0;font-weight:400}
#lobby h1 b{color:var(--hot);font-weight:400}
#lobby h2{font-size:21px;margin:2px 0 -4px;font-weight:400}
#lobby p{margin:0;font-size:16px;color:var(--muted);line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px}
.grid.w4{grid-template-columns:repeat(4,1fr)}
.card{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 5px;font-size:17px;line-height:1.2;text-align:center}
.card .ic{font-size:36px;line-height:1.15;font-family:var(--emoji)}
.card small{font-size:13px;color:var(--muted)}
.card .st{font-size:13px;color:#d08a00}
.card.on{background:var(--sun)}
.card.lock{background:#e4e6ee;color:#7a8097;border-style:dashed;box-shadow:none}
.modes{display:grid;grid-template-columns:1fr;gap:9px}
.modes button{font-size:21px;padding:12px 10px;text-align:left;display:flex;gap:10px;align-items:center}
.modes button .ic{font-size:30px;font-family:var(--emoji)}
.modes button small{display:block;font-size:14px;color:var(--muted)}
.modes .m1{background:#cfe6ff}.modes .m2{background:#ffd9df}.modes .m3{background:#d9f7d2}
.foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.foot button{flex:1;font-size:16px;padding:8px 8px;white-space:nowrap}
.who{display:flex;align-items:center;gap:10px}
.who .nm{font-size:24px}
.pill{font-size:15px;border:2px solid var(--ink);border-radius:9px;padding:1px 8px;background:#fff}
.g1{background:#ffe066}.g2{background:#9fe0ff}
input.txt{font-family:var(--display);font-size:20px;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;width:100%;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.opt{display:grid;grid-template-columns:66px 1fr;gap:8px;align-items:center}
.opt>span{font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;font-size:15px;box-shadow:0 2px 0 var(--ink);border-width:2px;border-radius:9px}
.chip.on{background:var(--sun)}
.chip .emo{font-size:18px}
.sw{width:34px;height:34px;padding:0;border-radius:8px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.sw.on{outline:3px solid var(--hot);outline-offset:1px}
.box{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.prize{font-size:84px;text-align:center;font-family:var(--emoji);line-height:1.1;animation:pop .5s}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
table.rec{border-collapse:collapse;width:100%;font-size:13.5px}
table.rec td,table.rec th{border:2px solid var(--ink);padding:3px 4px;text-align:center}
table.rec th{background:#ffe9a3;font-weight:400}
table.rec button{font-size:13px;padding:2px 6px;box-shadow:0 2px 0 var(--ink);border-width:2px}
.ver{font-size:13px;color:var(--muted)}
@media (max-width:760px),(orientation:portrait){#lobby{width:100%;top:36vh;border-left:0;border-top:5px solid var(--ink)}#lobby h1{font-size:30px}.grid.w4{grid-template-columns:repeat(2,1fr)}}

/* 대결 화면 */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button,#hud .qp,#stick{pointer-events:auto}
#top{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.pl{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 10px;box-shadow:0 4px 0 var(--ink);display:flex;flex-wrap:wrap;gap:0 10px;align-items:center;justify-self:start;max-width:100%}
.pl.r{justify-self:end;flex-direction:row-reverse}
.pl .nm{font-size:18px;color:#fff;border-radius:8px;padding:1px 8px;white-space:nowrap}
.pl .hp{font-size:21px;font-family:var(--emoji);white-space:nowrap}
.pl .am{font-size:19px;font-family:var(--emoji);white-space:nowrap;min-width:20px}
#mid{background:var(--ink);color:#fff;border-radius:14px;padding:3px 14px 5px;text-align:center;box-shadow:0 4px 0 #0005;min-width:110px}
#score{font-size:30px;line-height:1.1;white-space:nowrap}
#timer{font-size:15px;color:#ffe066;white-space:nowrap}
#bQuit{position:absolute;right:10px;top:74px;font-size:14px;padding:4px 10px;opacity:.9}
#big{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-size:clamp(48px,11vw,96px);color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:6}
#big.on{opacity:1}
#toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);background:var(--ink);color:#fff;font:20px var(--display);padding:10px 20px;border-radius:12px;text-align:center;max-width:86vw;opacity:0;transition:opacity .2s;box-shadow:0 5px 0 #0006;z-index:50;pointer-events:none}
#toast.on{opacity:1}

.qp{position:absolute;bottom:10px;background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:7px 9px 9px;display:flex;flex-direction:column;gap:6px}
.qp.solo{right:10px;width:min(610px,calc(100vw - 186px))}
.qp.L{left:8px;width:calc(50vw - 12px)}
.qp.R{right:8px;width:calc(50vw - 12px)}
.qp.A{border-color:var(--A)}.qp.B{border-color:var(--B)}
.qh{display:flex;align-items:center;gap:9px;min-height:58px}
.qt{font-size:16px;line-height:1.25;flex:1;min-width:0}
.qt b{font-weight:400;color:#c2410c}
.qs{display:flex;align-items:center;gap:8px}
.qbig{font-size:40px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:0 12px;line-height:1.3;white-space:nowrap}
.qemo{font-size:52px;line-height:1;font-family:var(--emoji)}
.qhear{font-size:30px;padding:4px 14px;background:#7fd0ff}
.qhear.pulse{animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:translateY(-3px);background:#b8e7ff}}
.qch{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;position:relative}
.tile{min-height:64px;padding:2px 4px;line-height:1.1;font-size:32px;white-space:nowrap;overflow:hidden}
.tile.e{font-size:40px;font-family:var(--emoji)}
.tile.no{background:#ffc9d2;opacity:.55}
.tile.yes{background:#a8f0ae;opacity:1}
.qcover{position:absolute;inset:-2px;background:#fffdf5e6;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#c2410c;text-align:center;padding:4px}
.qmsg{font-size:15px;min-height:19px;color:#a8213c;text-align:center;line-height:1.25}
.qmsg.good{color:#0e7a37}
.qa{display:flex;gap:8px}
.qa .dash{background:#b9e6ff;font-size:18px;padding:8px 10px;white-space:nowrap}
.qa .dash.cd{opacity:.5}
.qa .throw{flex:1;background:var(--hot);color:#fff;font-size:23px;padding:8px;white-space:nowrap}
.qa .throw .emo{font-size:24px}
.qa .throw.empty{background:#c8cbd6;color:#5d6685}
.qa .throw.ready{animation:pulse .5s infinite alternate}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#stick{position:absolute;left:18px;bottom:18px;width:150px;height:150px;border-radius:50%;background:#1b234055;border:3px solid #fff8;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fffd;border:3px solid var(--ink)}
#stickTip{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:14px;color:#fff;background:#1b2340bb;border-radius:8px;padding:1px 8px;white-space:nowrap}
@media (orientation:portrait){.qp.solo{left:8px;right:8px;width:auto}.qp.L,.qp.R{width:calc(50vw - 10px);padding:5px}.qp.L .tile,.qp.R .tile{font-size:24px}}

.veil{position:fixed;inset:0;background:#1b234099;display:grid;place-items:center;z-index:40;padding:12px}
.panel{background:var(--paper);border:5px solid var(--ink);border-radius:20px;padding:18px 22px;width:min(520px,100%);max-height:96%;overflow-y:auto;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:10px;text-align:center}
.panel h2{font-size:34px;margin:0;font-weight:400;line-height:1.15}
.panel p{margin:0;font-size:19px;line-height:1.45}
.panel .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#fail{position:fixed;inset:0;display:none;place-items:center;background:var(--paper);padding:24px;z-index:99;font-size:20px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="lobby"></div>

<div id="hud" class="hide">
  <div id="top">
    <div class="pl" id="tA"><span class="nm"></span><span class="hp"></span><span class="am"></span></div>
    <div id="mid"><div id="score">0 : 0</div><div id="timer"></div></div>
    <div class="pl r" id="tB"><span class="nm"></span><span class="hp"></span><span class="am"></span></div>
  </div>
  <button id="bQuit">그만하기</button>
  <div id="stick"><div id="stickTip">움직이기</div><div id="knob"></div></div>
  <div id="big"></div>
</div>

<div id="res" class="veil hide"><div class="panel">
  <div class="prize" id="resIc"></div>
  <h2 id="resTitle"></h2>
  <p id="resText"></p>
  <div class="acts"><button id="resAgain" class="go">다시 하기</button><button id="resOut">대결장 나가기</button></div>
</div></div>

<div id="toast"></div>
<div id="fail">이 기기에서는 3D 화면을 열 수 없습니다.<br>크롬이나 사파리 최신판으로 다시 열어 봅시다.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const TEST=location.search.includes('test');

/* DATA-START */
/* ───────── 학습 내용: 찬찬한글(학생용, 한국교육과정평가원) 1~10단원, 8~185쪽 ───────── */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',JONG=' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
const mk=(c,v,j)=>String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(v))*28+(j?JONG.indexOf(j):0));
const sp=s=>{const n=s.charCodeAt(0)-0xAC00;return[CHO[Math.floor(n/588)],JUNG[Math.floor(n%588/28)],n%28?JONG[n%28]:'']};
const isSyl=s=>{const n=s.charCodeAt(0);return n>=0xAC00&&n<=0xD7A3};
const VOW=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
const vs=v=>mk('ㅇ',v);
const VG=[['ㅏ','ㅑ','ㅓ','ㅕ'],['ㅗ','ㅛ','ㅜ','ㅠ'],['ㅡ','ㅣ','ㅗ','ㅜ'],['ㅏ','ㅓ','ㅗ','ㅜ'],['ㅑ','ㅕ','ㅛ','ㅠ'],['ㅡ','ㅣ','ㅏ','ㅓ']];
/* 2단원 배움 8~12 묶음 */
const CG=[['ㄱ','ㅋ','ㄲ'],['ㄴ','ㄷ','ㅌ','ㄸ'],['ㅁ','ㅂ','ㅍ','ㅃ'],['ㅅ','ㅈ','ㅊ','ㅉ','ㅆ'],['ㅇ','ㅎ','ㄹ']];
const V6=['ㅏ','ㅓ','ㅗ','ㅜ','ㅡ','ㅣ'];
/* 소리가 같거나 비슷한 복잡한 모음은 같은 묶음(4단원 82~97쪽) */
const CV={'ㅐ':'e','ㅔ':'e','ㅒ':'ye','ㅖ':'ye','ㅘ':'wa','ㅝ':'wo','ㅙ':'we','ㅞ':'we','ㅚ':'we','ㅟ':'wi','ㅢ':'ui'};
const CVOW=Object.keys(CV);
const BAT=['ㅁ','ㅂ','ㅇ','ㄱ','ㄴ','ㄹ','ㄷ'];
const VSW={'ㅏ':'ㅓ','ㅓ':'ㅏ','ㅗ':'ㅜ','ㅜ':'ㅗ','ㅑ':'ㅕ','ㅕ':'ㅑ','ㅛ':'ㅠ','ㅠ':'ㅛ','ㅡ':'ㅣ','ㅣ':'ㅡ','ㅐ':'ㅏ','ㅔ':'ㅓ','ㅒ':'ㅑ','ㅖ':'ㅕ','ㅘ':'ㅝ','ㅝ':'ㅘ','ㅙ':'ㅘ','ㅞ':'ㅝ','ㅚ':'ㅗ','ㅟ':'ㅢ','ㅢ':'ㅟ'};
const CSW={'ㄱ':'ㅋ','ㅋ':'ㄲ','ㄲ':'ㄱ','ㄴ':'ㄹ','ㄷ':'ㅌ','ㅌ':'ㄸ','ㄸ':'ㄷ','ㄹ':'ㄴ','ㅁ':'ㅂ','ㅂ':'ㅍ','ㅍ':'ㅃ','ㅃ':'ㅂ','ㅅ':'ㅈ','ㅈ':'ㅊ','ㅊ':'ㅉ','ㅉ':'ㅈ','ㅆ':'ㅅ','ㅇ':'ㅎ','ㅎ':'ㅇ'};
/* 받침의 대표 소리(6~9단원): ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅇ */
const REP={};[['ㄱ','ㄱㄲㅋㄳㄺ'],['ㄴ','ㄴㄵㄶ'],['ㄷ','ㄷㅅㅆㅈㅊㅌㅎ'],['ㄹ','ㄹㄼㄽㄾㅀ'],['ㅁ','ㅁㄻ'],['ㅂ','ㅂㅍㅄㄿ'],['ㅇ','ㅇ']].forEach(([r,s])=>[...s].forEach(j=>REP[j]=r));
const CLUS='ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ';
const pron1=s=>{if(!isSyl(s))return s;const[c,v,j]=sp(s);return j?mk(c,v,REP[j]):s};
/* 한 글자 낱말은 대표 소리로 읽어 준다(꽃→꼳, 닭→닥) */
const sayOf=w=>[...w].length===1?pron1(w):w;
const BAD=['시발','씨발','병신','새끼','좆','존나','지랄','썅','미친','개새','꼰대','바보','멍청','똥꼬'];
const okW=w=>!BAD.some(b=>w.includes(b));

const PIC={아이:'🧒',여우:'🦊',오이:'🥒',우유:'🥛',아기:'👶',
 나무:'🌳',다리:'🦵',파리:'🪰',오리:'🦆',가지:'🍆',고기:'🥩',나비:'🦋',기타:'🎸',바구니:'🧺',코끼리:'🐘',기차:'🚂',버스:'🚌',치즈:'🧀',모기:'🦟',주스:'🧃',스키:'🎿',포도:'🍇',소파:'🛋️',소나무:'🌲',거미:'🕷️',피아노:'🎹',너구리:'🦝',모자:'🧢',지도:'🗺️',파도:'🌊',도자기:'🏺',가수:'🎤',
 개:'🐕',게:'🦀',해:'☀️',배:'🍐',새:'🐦',시계:'⏰',귀:'👂',과자:'🍪',화가:'🎨',돼지:'🐷',뇌:'🧠',외투:'🧥',의자:'🪑',의사:'🧑‍⚕️',바위:'🪨',거위:'🦢',
 야구:'⚾',요리사:'🧑‍🍳',소녀:'👧',사과:'🍎',교과서:'📚',야채:'🥬',추위:'🥶',더위:'🥵',
 곰:'🐻',뱀:'🐍',그림:'🖼️',구름:'☁️',참외:'🍈',접시:'🍽️',수첩:'📒',서랍:'🗄️',입:'👄',집:'🏠',밥:'🍚',상어:'🦈',피망:'🫑',풍선:'🎈',호랑이:'🐯',공:'🏀',왕:'👑',학교:'🏫',수박:'🍉',축구:'⚽',가족:'👪',책:'📕',분수:'⛲',우산:'☂️',기린:'🦒',산:'⛰️',손:'✋',콜라:'🥤',구슬:'🔮',얼굴:'🙂',별:'⭐',달:'🌙',물:'💧',귤:'🍊',돋보기:'🔍',숟가락:'🥄',걷다:'🚶',
 염소:'🐐',감자:'🥔',강가:'🏞️',야구공:'⚾',늑대:'🐺',축구공:'⚽',고릴라:'🦍',만두:'🥟',
 꽃:'🌷',옷:'👕',낚시:'🎣',잎:'🍃',젖소:'🐄',솥:'🍲',숲:'🌳',빗:'🪮',무릎:'🦵',덮밥:'🍛',높다:'🏢',떡볶이:'🍢',부엌:'🍳',햇빛:'☀️',벚꽃:'🌸',
 저녁:'🌇',과녁:'🎯',닦다:'🧽',볶음밥:'🍛',입술:'👄',팝콘:'🍿',은행잎:'🍂',가마솥:'🍲',모래밭:'🏖️',첫째:'🥇',돛단배:'⛵',낮잠:'😴',
 읽다:'📖',닭:'🐔',밝다:'💡',많다:'🍎🍎🍎',괜찮다:'👌',늙다:'👵',싫다:'🙅',앉다:'🪑',없다:'🤷'};
/* 1단원 26쪽 */

let ac=null,mg,musicGain,vGain,nextT=0,seq=0,muted=false;
function audioInit(){if(ac){if(ac.state==='suspended')ac.resume();return}try{ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.8;mg.connect(ac.destination);musicGain=ac.createGain();musicGain.gain.value=0;musicGain.connect(mg);vGain=ac.createGain();vGain.gain.value=1.3;vGain.connect(mg);nextT=ac.currentTime+.1;setInterval(sched,60)}catch(e){ac=null}}
function tone(f,t,d,type,v,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||mg);o.start(t);o.stop(t+d+.02)}
function sfx(fs,d=.1,type='triangle',v=.22){if(!ac||muted)return;let t=ac.currentTime;fs.forEach(f=>{tone(f,t,d*1.6,type,v);t+=d})}
let nb=null;function noise(t,d,v,dest,hp=6000){if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.buffer=nb;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dest||mg);s.start(t);s.stop(t+d)}
const whoosh=()=>{if(!ac||muted)return;noise(ac.currentTime,.25,.35,mg,1500)};
const splashS=()=>{if(!ac||muted)return;noise(ac.currentTime,.35,.5,mg,400);tone(180,ac.currentTime,.2,'sine',.3)};
const ROOT=[146.83,174.61,130.81,196];const ARP=[[587,698,880,698,1175,880,698,880],[698,880,1047,880,1397,1047,880,1047],[523,659,784,659,1047,784,659,784],[784,988,1175,988,1568,1175,988,1175]];
function sched(){if(!ac||ac.state!=='running')return;while(nextT<ac.currentTime+.2){const s=seq%16,bar=Math.floor(seq/16)%4,t=nextT;
  if(s%4===0){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.18)}
  if(s%4===2)noise(t,.05,.22,musicGain);if(s%8===4)noise(t,.11,.34,musicGain);
  if([0,3,6,8,11,14].includes(s))tone(ROOT[bar],t,.14,'sawtooth',.26,musicGain);
  if(s%2===0)tone(ARP[bar][s/2],t,.1,'square',.06,musicGain);
  nextT+=.115;seq++}}
const vCache={};let vTok=0,vNodes=[],voicing=false;
function vLoad(t){if(vCache[t])return vCache[t];const id=SND[t];if(!id||!ac)return Promise.resolve(null);
  return vCache[t]=fetch('snd/'+id+'.mp3').then(r=>{if(!r.ok)throw new Error('snd');return r.arrayBuffer()}).then(b=>new Promise((res,rej)=>ac.decodeAudioData(b,res,rej))).catch(()=>{delete vCache[t];return null})}
function vStop(){vTok++;vNodes.forEach(n=>{try{n.stop()}catch(e){}});vNodes=[];try{speechSynthesis.cancel()}catch(e){}voicing=false}
function ttsSay(t){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.85;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,600+t.length*260)}catch(e){res()}})}
async function voice(list){vStop();const my=vTok;list=(list||[]).filter(Boolean);if(muted||!list.length)return;voicing=true;
  for(const t of list){if(my!==vTok)return;const buf=ac?await vLoad(t):null;if(my!==vTok)return;
    if(buf){await new Promise(res=>{const s=ac.createBufferSource();s.buffer=buf;s.connect(vGain);s.onended=res;s.start();vNodes.push(s)})}
    else await ttsSay(t);
    if(my!==vTok)return;await new Promise(r=>setTimeout(r,120))}
  if(my===vTok)voicing=false}

    x:side?SPAWN:-SPAWN,z:0,vx:0,vz:0,yaw:side?-Math.PI/2:Math.PI/2,hp:3,maxHp:3,ammo:1,shield:false,inv:0,dash:0,dashCd:0,dx:0,dz:0,

function resetPos(f){f.x=f.nx=f.side?SPAWN:-SPAWN;f.z=f.nz=0;f.vx=f.vz=0;f.dash=0;f.dashCd=0;f.inv=0;f.c.hurtT=0;f.c.danceT=0}

  B.f.forEach((f,i)=>{resetPos(f);f.hp=f.maxHp;f.ammo=1;f.shield=B.sc[1-i]-B.sc[i]>=2;
    if(f.cpu){f.cpu.next=f.cpu.mean*(.6+Math.random()*.5);f.cpu.hold=.8+Math.random()}

function endRound(w){ /* w: 이긴 쪽 0/1, 비기면 -1 */

const meSide=()=>0;

/* 움직임 */
function clampF(f){
  if(f.side===0)f.x=Math.max(-XMAX,Math.min(-XMIN,f.x));else f.x=Math.max(XMIN,Math.min(XMAX,f.x));
  f.z=Math.max(-ZMAX,Math.min(ZMAX,f.z));
  for(const o of OBST){const dx=f.x-o.x,dz=f.z-o.z,px=o.hw+.45-Math.abs(dx),pz=o.hd+.45-Math.abs(dz);
    if(px>0&&pz>0){if(px<pz)f.x+=Math.sign(dx||1)*px;else f.z+=Math.sign(dz||1)*pz}}
}
function moveF(f,ix,iz,spd,dt){
  if(f.dash>0){f.dash-=dt;ix=f.dx;iz=f.dz;spd=15}
  const l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l}
  const ox=f.x,oz=f.z;
  f.x+=ix*spd*dt;f.z+=iz*spd*dt;clampF(f);
  f.vx=(f.x-ox)/Math.max(dt,1e-3);f.vz=(f.z-oz)/Math.max(dt,1e-3);
  f.c.state=Math.hypot(f.vx,f.vz)>.6?1:0;
}
function faceF(f,dt){
  const o=B.f[1-f.side];let ty;
  if(f.c.state===1&&Math.hypot(f.vx,f.vz)>1&&f.c.throwT<=0&&Math.abs(f.vz)>Math.abs(f.vx)*1.5)ty=Math.atan2(f.vx,f.vz);
  else ty=Math.atan2(o.x-f.x,o.z-f.z);
  let d=ty-f.yaw;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;f.yaw+=d*Math.min(1,dt*12);
  f.c.root.position.set(f.x,0,f.z);f.c.root.rotation.y=f.yaw;
}
/* 다가오는 공을 피해 옆으로 휙 */
function dashF(f,ix,iz){
  if(f.dashCd>0||B.ph!=='play')return;
  let dx=ix,dz=iz;
  if(Math.hypot(dx,dz)<.2){const p=incoming(f);if(p){dx=f.x-p.x1;dz=f.z-p.z1;if(Math.hypot(dx,dz)<.2)dz=Math.random()<.5?-1:1}else{dz=f.z>0?-1:1;dx=0}}
  const l=Math.hypot(dx,dz)||1;f.dx=dx/l;f.dz=dz/l;f.dash=.2;f.dashCd=2;
  sfx([660,880],.04,'square',.1);
  for(let i=0;i<6;i++)sparkle(f.x,.5+Math.random(),f.z,'#ffffff');
}
function incoming(f){let best=null,bd=1e9;for(const p of B.proj){if(p.side===f.side||p.done)continue;const d=Math.hypot(p.x1-f.x,p.z1-f.z);if(d<bd){bd=d;best=p}}return best}

/* 던지기: 상대가 움직이는 쪽을 살짝 앞질러 자동으로 겨눈다 */
function throwF(f){
  if(B.ph!=='play'||f.ammo<=0||f.throwCd>0)return false;
  const o=B.f[1-f.side],W=WEAPONS[f.weapon];
  f.ammo--;f.c.throwT=.35;f.throwCd=.5;
  let tx=o.x+o.vx*W.T*.55+(Math.random()-.5)*2*W.err,tz=o.z+o.vz*W.T*.55+(Math.random()-.5)*2*W.err;
  if(o.side===0)tx=Math.max(-XMAX,Math.min(-XMIN,tx));else tx=Math.max(XMIN,Math.min(XMAX,tx));
  tz=Math.max(-ZMAX,Math.min(ZMAX,tz));
  const col=f.col==='rainbow'?`hsl(${rnd(360)},90%,58%)`:(f.col||W.col);
  fire(f.side,f.weapon,f.x,f.z,tx,tz,col,f.trail,B.mode!=='net');
  if(B.mode==='net')netSend({k:'f',w:f.weapon,x:+f.x.toFixed(2),z:+f.z.toFixed(2),tx:+tx.toFixed(2),tz:+tz.toFixed(2),c:col,tr:f.trail});
  whoosh();updateHud();
  return true;
}
function fire(side,w,x,z,tx,tz,col,trail,check){
  const W=WEAPONS[w];const list=W.n===3?[[tx,tz-1.5],[tx,tz],[tx,tz+1.5]]:[[tx,tz]];
  list.forEach(([a,b],i)=>{
    b=Math.max(-ZMAX,Math.min(ZMAX,b));
    const m=projMesh(w,col);m.position.set(x,1.7,z);scene.add(m);
    /* 떨어질 곳 표시: 원의 크기가 곧 맞는 범위다. 공이 다가올수록 진해진다 */
    const r=W.splash+.35,mk=new THREE.Group();
    const fillM=new THREE.Mesh(new THREE.CircleGeometry(r,40),new THREE.MeshBasicMaterial({color:TEAM[side],transparent:true,opacity:0,depthWrite:false}));
    const edgeM=new THREE.Mesh(new THREE.RingGeometry(r-.13,r,40),new THREE.MeshBasicMaterial({color:TEAM[side],transparent:true,opacity:0,depthWrite:false}));
    mk.add(fillM,edgeM);mk.rotation.x=-Math.PI/2;mk.position.set(a,.04,b);scene.add(mk);
    const sh=new THREE.Mesh(blobGeo,blobMat);sh.rotation.x=-Math.PI/2;sh.scale.setScalar(.35);sh.position.set(x,.05,z);scene.add(sh);
    B.proj.push({side,w,m,mk,sh,fillM,edgeM,x0:x,z0:z,x1:a,z1:b,T:W.T*(1+i*.06),t:0,h:W.h,col,trail,check,done:false,dodged:false,tt:0});
  });
}
function dropProj(p){scene.remove(p.m);if(p.mk){scene.remove(p.mk);p.mk.children.forEach(c=>{c.geometry.dispose();c.material.dispose()})}if(p.sh)scene.remove(p.sh)}
function projMesh(w,col){
  const g=new THREE.Group();
  if(w===0){sph(g,.42,col,0,0,0);cone(g,.12,.2,col,0,-.48,0).rotation.x=Math.PI;sph(g,.12,'#ffffff',-.15,.17,.3,true)}
  else if(w===1){const a=box(g,.95,.18,.28,col,.3,0,0);a.rotation.y=.55;const b=box(g,.95,.18,.28,col,-.3,0,0);b.rotation.y=-.55}
  else if(w===2){const m=new THREE.Mesh(G.sph,new THREE.MeshLambertMaterial({color:col,transparent:true,opacity:.55}));m.scale.setScalar(.45);g.add(m);sph(g,.1,'#ffffff',-.18,.18,.3,true)}
  else{cyl(g,.16,.8,col,0,0,0);cone(g,.2,.35,'#ffc824',0,.55,0);sph(g,.13,'#ffe066',0,-.45,0,true)}
  return g;
}
function projTick(dt){
  for(let i=B.proj.length-1;i>=0;i--){
    const p=B.proj[i];p.t+=dt;const u=Math.min(1,p.t/p.T);
    const x=p.x0+(p.x1-p.x0)*u,z=p.z0+(p.z1-p.z0)*u,y=1.7*(1-u)+.3*u+4*p.h*u*(1-u);
    p.m.position.set(x,y,z);p.sh.position.set(x,.05,z);
    p.fillM.material.opacity=.08+u*.22;p.edgeM.material.opacity=.35+u*.6;
    if(p.w===1)p.m.rotation.y+=dt*22;else if(p.w===3){p.m.rotation.z=(p.x1>p.x0?-1:1)*(1.2-u*2.4)*.9}else p.m.rotation.y+=dt*3;
    p.tt+=dt;if(p.trail&&p.tt>.035){p.tt=0;sparkle(x,y,z,p.trail)}
    if(p.w===3&&Math.random()<.5)sparkle(x,y-.3,z,'#ffc824');
    /* 피하는 쪽 땅의 가림막에만 막힌다 (내 쪽 가림막은 내 공을 막지 않는다) */
    let blocked=false;
    for(const o of OBST){if(Math.sign(o.x)===Math.sign(p.x1)&&Math.abs(x-o.x)<o.hw+.15&&Math.abs(z-o.z)<o.hd+.15&&y<o.h+.1){blocked=true;break}}
    if(blocked){burst(x,y,z,p.col,10,5);splashS();dropProj(p);B.proj.splice(i,1);continue}
    const v=B.f[1-p.side];
    /* 날아가다 몸에 닿으면 그 자리에서 터지고 맞은 것으로 한다 */
    if(v&&u>.3&&Math.hypot(x-v.x,z-v.z)<.95&&y<3.1){burst(x,y,z,p.w===3?'rainbow':p.col,18,7);splashS();if(p.check)hitF(v);dropProj(p);B.proj.splice(i,1);continue}
    /* 컴퓨터 라이벌은 다가오는 공을 보고 피하기도 한다 */

function qNext(f){

function qAnswer(f,i,btn){
  const Q=f.qs,q=Q.q,ui=f.ui;

  const ok=q.ch[i]===q.ans,p=f.prof;

    const first=Q.tries===0;

    else{ui.msg.className='qmsg good';ui.msg.textContent='맞았어요! 처음에 맞혀야 던질 것이 생겨요.';sfx([660,880],.07)}
    track(f,q.u,first);updateHud();

      Q.retry.push({q:{...q,again:false},due:Q.cnt+3});track(f,q.u,false);

    }else{

/* 수준 맞추기: 처음에 4번 잇달아 맞히면 한 단계 위, 최근 5문제 중 3문제를 놓치면 한 단계 아래 */

  Q.recent.push(ok?1:0);if(Q.recent.length>5)Q.recent.shift();
  if(ok){Q.streak++;if(Q.streak>=4&&f.lv<5){f.lv++;Q.streak=0;Q.recent=[];if(B.mode!=='duo')setTimeout(()=>voice([P.lvup]),700);toast(`${f.name} ⭐ 수준이 올랐어요! (${f.lv}단계)`)}}

/* ───────── 여러 태블릿 대결(MQTT) ───────── */
const myId=Math.random().toString(36).slice(2,10);
const TOPIC='jeomgok-hangul-arena/v1/q8w3e5r1/room';
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://mqtt.eclipseprojects.io:443/mqtt'];
const NET={cl:null,room:-1,state:'off',peer:null,peerSeen:0,bi:0,lastSend:0,wantMatch:false};
const num=(v,lo,hi,d=0)=>{v=Number(v);return Number.isFinite(v)?Math.max(lo,Math.min(hi,v)):d};
function netConnect(cb){
  if(!window.mqtt){cb(false);return}
  if(NET.cl&&NET.state==='on'){cb(true);return}
  let done=false;const fin=ok=>{if(!done){done=true;cb(ok)}};
  const tryB=()=>{
    let cl=null,ok=false;
    try{cl=mqtt.connect(BROKERS[NET.bi],{clientId:'ha_'+myId+'_'+rnd(9999),reconnectPeriod:0,connectTimeout:6000,keepalive:30,clean:true})}catch(e){next();return}
    function next(){if(next.done)return;next.done=true;try{cl&&cl.end(true)}catch(_){ }if(ok){NET.state='off';NET.cl=null;if(NET.room>=0)roomLost();return}NET.bi++;if(NET.bi<BROKERS.length)tryB();else{NET.bi=0;NET.state='off';fin(false)}}
    cl.on('connect',()=>{ok=true;NET.cl=cl;NET.state='on';fin(true)});
    cl.on('message',(t,b)=>onNet(t,b));
    cl.on('error',next);cl.on('close',next);
  };
  tryB();
}
function roomTopic(k){return TOPIC+k+'/'}
function netSend(o){if(!NET.cl||NET.state!=='on'||NET.room<0)return;try{o.to=NET.peer||'';NET.cl.publish(roomTopic(NET.room)+myId,JSON.stringify(o),{qos:0})}catch(e){}}
let netWaitTimer=0;
function roomJoin(k){
  showLobby('wait',{room:k});
  netConnect(ok=>{
    if(!ok){showLobby('room',{fail:true});return}
    if(NET.room>=0&&NET.room!==k){try{NET.cl.unsubscribe(roomTopic(NET.room)+'+')}catch(e){}}
    NET.room=k;NET.peer=null;NET.wantMatch=true;
    NET.cl.subscribe(roomTopic(k)+'+',{qos:0});
    clearInterval(netWaitTimer);netWaitTimer=setInterval(()=>{if(NET.room<0||B.mode==='net'){clearInterval(netWaitTimer);return}netHello()},700);netHello();
  });
}
function myInfo(){const p=prof();return{n:p.name,g:p.grade,l:p.look,h:hatOf(p),w:p.weapon,c:colOf(p),tr:trailOf(p)}}
function netHello(){netSend({k:'h',...myInfo(),busy:B.mode==='net'?1:0})}
function netLeave(bye){
  if(bye)netSend({k:'bye'});
  if(NET.cl&&NET.room>=0){try{NET.cl.unsubscribe(roomTopic(NET.room)+'+')}catch(e){}}
  NET.room=-1;NET.peer=null;NET.wantMatch=false;clearInterval(netWaitTimer);
}
function roomLost(){if(B.mode==='net'&&B.ph!=='over'){toast('친구와 연결이 끊어졌어요.',3500);leaveBattle()}else if(lobbyScr==='wait'){NET.room=-1;showLobby('room',{fail:true})}}

  if(d.k==='bye'){if(id===NET.peer){if(B.mode==='net'&&B.ph!=='over'){toast('친구가 대결장을 나갔어요.',3500);leaveBattle()}else{NET.peer=null}}return}

    netSend({k:'h',...myInfo(),busy:0});
    startMatch('net',{players:[me,other],host,arena:host?p.arena:0,room:NET.room});

  }
  if(B.mode!=='net'||id!==NET.peer)return;
  const o=B.f[1],me=B.f[0];
  if(d.k==='s'){
    const sx=num(d.x,-12,12,NaN),sz=num(d.z,-6,6,NaN);if(Number.isFinite(sx))o.nx=-sx;if(Number.isFinite(sz))o.nz=sz;
    const hp=num(d.hp,0,4,o.hp)|0;if(hp<o.hp){o.c.hurtT=.5;floatText(pick(['철퍽!','퐁!']),o.x,3.4,o.z,'#ffffff')}
    o.hp=hp;o.maxHp=num(d.mh,3,4,o.maxHp)|0;o.ammo=num(d.am,0,3,0)|0;o.shield=!!d.sh;updateHud();

  if(d.k==='r'&&!B.host){
    const sc=Array.isArray(d.sc)?[num(d.sc[1],0,9)|0,num(d.sc[0],0,9)|0]:B.sc;
    if(d.ph==='count'){B.sc=sc;B.need=num(d.need,1,9,B.need)|0;B.time=num(d.time,20,180,B.time)|0;const ar=num(d.ar,0,2)|0;if(ar!==B.arena){B.arena=ar;buildArena(ar)}B.round=(num(d.rd,1,99,1)|0)-1;startRound()}
    if(d.ph==='end'&&B.ph==='play'){const w=num(d.w,-1,1,-1)|0;B.sc=sc;B.ph='end';B.cd=2.8;if(w>=0)B.f[1-w].c.danceT=2.6;roundFx(w<0?-1:1-w)}
    if(d.ph==='match'){B.sc=sc;matchOver()}
  }
}
function netState(force){

const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let lastT=performance.now();
function battleTick(dt){
  const [a,b]=B.f;if(!a)return;
  if(B.ph==='count'){B.cd-=dt;const n=Math.ceil(B.cd-.4);
    if(n>=1&&$('big').textContent!==String(n))bigText(String(n),0);
    if(B.cd<=.4&&B.cd+dt>.4){B.ph='play';bigText('시작!',800);voice([P.go]);B.f.forEach(f=>{if(f.qs){qRender(f);qSpeak(f,true)}});updateHud()}}
  else if(B.ph==='play'){
    B.timer-=dt;
    if(B.mode!=='net'||B.host){
      const dead=[a.hp<=0,b.hp<=0];
      if(dead[0]||dead[1])endRound(dead[0]&&dead[1]?-1:dead[0]?1:0);
      else if(B.timer<=0){const la=a.maxHp-a.hp,lb=b.maxHp-b.hp;endRound(la===lb?-1:la<lb?0:1)}
    }
    if(Math.ceil(B.timer)!==Math.ceil(B.timer+dt))updateHud();
  }else if(B.ph==='end'){
    B.cd-=dt;
    if(B.cd<=0&&(B.mode!=='net'||B.host)){
      if(B.sc[0]>=B.need||B.sc[1]>=B.need){if(B.mode==='net')netSend({k:'r',ph:'match',sc:B.sc});matchOver()}
      else startRound();
    }
  }
  for(const f of B.f){
    f.inv=Math.max(0,f.inv-dt);f.dashCd=Math.max(0,f.dashCd-dt);f.throwCd=Math.max(0,f.throwCd-dt);
    if(f.ui)f.ui.dash.classList.toggle('cd',f.dashCd>0);
    const can=B.ph==='play'||B.ph==='count';
    if(f.ctrl==='me'){const v=stickV();moveF(f,can?v.x:0,can?v.z:0,4.8,dt)}
    else if(f.ctrl==='cpu')cpuTick(f,dt);
    else if(f.ctrl==='local')wander(f,dt,2.4);
    else if(f.ctrl==='net'){const ox=f.x,oz=f.z;f.x+=(f.nx-f.x)*Math.min(1,dt*10);f.z+=(f.nz-f.z)*Math.min(1,dt*10);f.vx=(f.x-ox)/dt;f.vz=(f.z-oz)/dt;f.c.state=Math.hypot(f.vx,f.vz)>.6?1:0}
    faceF(f,dt);
    f.c.shield.visible=f.shield;f.c.root.visible=!(f.inv>0&&Math.floor(f.inv*20)%2===0&&f.hp>0);
  }
  projTick(dt);
  if(B.mode==='net'){netState(false);if(performance.now()-NET.peerSeen>8000&&B.ph!=='over'){toast('친구와 연결이 끊어졌어요.',3500);leaveBattle()}}
}
function frame(){
  requestAnimationFrame(frame);
  const pn=performance.now(),real=Math.min(.3,(pn-lastT)/1000),dt=Math.min(.05,real);lastT=pn;const now=Date.now();
  const inBattle=!$('hud').classList.contains('hide');
  /* 화면이 느린 기기에서도 시간은 실제 초대로 흐르게 잘게 나눠 계산한다 */
  if(inBattle&&!(TEST&&window.__pause))for(let t=real;t>1e-4;t-=.05)battleTick(Math.min(.05,t));
  B.f.forEach(f=>{if(f)animate(f.c,dt,now)});
  if(preview){animate(preview,dt,now);preview.root.rotation.y=Math.sin(now/1500)*.5}
  for(let i=parts.length-1;i>=0;i--){const m=parts[i];m.t-=dt;m.v.y-=m.g*dt;m.position.addScaledVector(m.v,dt);m.rotation.x+=dt*5;if(m.t<=0){scene.remove(m);parts.splice(i,1)}}
  for(let i=rings.length-1;i>=0;i--){const m=rings[i];m.t+=dt;const s=1+m.t*m.r*5;m.scale.set(s,s,s);m.material.opacity=Math.max(0,.85-m.t*1.6);if(m.t>.55){scene.remove(m);m.geometry.dispose();m.material.dispose();rings.splice(i,1)}}
  for(let i=floats.length-1;i>=0;i--){const s=floats[i];s.t-=dt;s.position.y+=dt*1.4;s.material.opacity=Math.min(1,s.t*2);if(s.t<=0){scene.remove(s);s.material.map.dispose();s.material.dispose();floats.splice(i,1)}}
  clouds.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>80)c.position.x=-80});
  if(musicGain)musicGain.gain.value=inBattle&&B.ph!=='over'?(voicing?.05:.2):.06;
  /* 카메라 */
  if(inBattle){
    const w=innerWidth,h=innerHeight,topH=70,avail=Math.max(120,h-panelH-topH),fov=camera.fov*Math.PI/180;
    const vfovA=fov*avail/h,hfov=2*Math.atan(Math.tan(fov/2)*w/h),el=.92;
    const Dh=13.6/Math.tan(hfov/2),Dv=(12*Math.sin(el)+3.2)/2/Math.tan(vfovA/2);
    const D=Math.max(Dh,Dv)*1.02;
    camLook.set(0,.9,.4);camPos.set(0,.9+D*Math.sin(el),.4+D*Math.cos(el));
    camera.position.copy(camPos);camera.lookAt(camLook);
    const shift=(panelH-topH)/2;camera.setViewOffset(w,h,0,shift,w,h);
  }else{
    camera.clearViewOffset();
    const wide=innerWidth>760&&innerWidth>innerHeight,px=0;
    camPos.set(px+(wide?3.3:0),2.6,PZ+9+(wide?0:1.5));camLook.set(px+(wide?3.3:0),wide?1.5:.2,PZ);
    camera.position.lerp(camPos,Math.min(1,dt*6));camera.lookAt(camLook);
  }
  renderer.render(scene,camera);
}

    h+=`</table></div><p>1 모음 · 2 자음 · 3 받침 없는 낱말 · 4 복잡한 모음 · 5 복잡한 모음 낱말 · 6 대표받침 · 7 대표받침 낱말 · 8 복잡한 받침 · 9 겹받침 낱말 · 10 최종 평가</p>
      <div class="foot"><button data-a="wipe">기록 모두 지우기</button><button class="go" data-a="who">닫기</button></div>`;
  }
  el.innerHTML=h;el.scrollTop=0;
}
let armT=0,armK='';
function armed(k){if(armK===k&&Date.now()-armT<3000){armK='';return true}armK=k;armT=Date.now();toast('한 번 더 누르면 지워져요.');return false}
$('lobby').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;audioInit();
  const A=b.dataset.a,i=+b.dataset.i,p=prof();sfx([600],.04);
  if(A==='pick'){S.cur=i;save();showLobby('main');if(!TEST)voice([P.welcome])}
  else if(A==='new')showLobby('new',{g:1});
  else if(A==='ng'){lobbyArg.g=+b.dataset.g;const v=$('nName').value;renderLobby();$('nName').value=v}
  else if(A==='mkprof'){const n=cleanName($('nName').value);if(!n){toast('별명을 써 봅시다.');return}S.profs.push(newProf(n,lobbyArg.g||1));S.cur=S.profs.length-1;save();showLobby('main')}
  else if(A==='who'){S.cur=-1;save();showLobby('who')}
  else if(A==='main')showLobby('main');
  else if(A==='snd'){muted=!muted;if(muted)vStop();renderLobby()}
  else if(A==='wpn'){if(b.classList.contains('lock')){toast('선생님이 그 단원을 열어 주면 쓸 수 있어요.');return}p.weapon=i;save();renderLobby()}
  else if(A==='arena'){if(b.classList.contains('lock')){toast(`${ARENAS[i].need}번 이기면 열려요!`);return}p.arena=i;save();B.arena=i;buildArena(i);renderLobby()}
  else if(A==='rivals'){if(!unitsFor(p.grade,p.weapon)){toast('먼저 쓸 수 있는 무기를 골라 봅시다.');return}showLobby('rivals')}
  else if(A==='cpu'){const R=RIVALS[i];const g1=p.grade===1;
    startMatch('cpu',{arena:p.arena,rival:i,players:[
      {name:p.name,grade:p.grade,look:p.look,hat:hatOf(p),weapon:p.weapon,col:colOf(p),trail:trailOf(p),ctrl:'me',prof:p,lv:p.lv[p.weapon]},
      {name:R.name,grade:0,look:R.look,hat:R.hat,weapon:p.weapon,ctrl:'cpu',cpu:{mean:R.mean*(g1?1.15:1),dodge:R.dodge*(g1?.8:1),spd:R.spd,next:3,hold:1}}]})}
  else if(A==='duo'){if(S.profs.length<2){toast('먼저 「새 친구」를 만들어 봅시다.');return}showLobby('duo')}
  else if(A==='mate'){lobbyArg.mate=i;renderLobby()}
  else if(A==='mwpn'){if(b.classList.contains('lock'))return;S.profs[lobbyArg.mate].weapon=i;save();renderLobby()}
  else if(A==='duogo'){const q=S.profs[lobbyArg.mate];if(!q)return;
    if(!unitsFor(p.grade,p.weapon)||!unitsFor(q.grade,q.weapon)){toast('잠긴 무기는 쓸 수 없어요.');return}
    const pl=x=>({name:x.name,grade:x.grade,look:x.look,hat:hatOf(x),weapon:x.weapon,col:colOf(x),trail:trailOf(x),ctrl:'local',prof:x,lv:x.lv[x.weapon]});
    startMatch('duo',{arena:p.arena,players:[pl(p),pl(q)]})}
  else if(A==='room'){if(!unitsFor(p.grade,p.weapon)){toast('먼저 쓸 수 있는 무기를 골라 봅시다.');return}showLobby('room')}
  else if(A==='join')roomJoin(i);
  else if(A==='leaveRoom'){netLeave(true);showLobby('room')}
  else if(A==='look')showLobby('look');
  else if(A==='lk'){p.look[+b.dataset.i]=+b.dataset.k;save();setPreview();renderLobby()}
  else if(A==='eq'){const t=b.dataset.t,v=b.dataset.v;if(t==='hat')p.eq.hat=+v;else p.eq[t]=v;save();setPreview();renderLobby()}
  else if(A==='rand'){p.look=randLook();save();setPreview();renderLobby()}
  else if(A==='chest')showLobby('chest');
  else if(A==='open'){const left=ITEMS.filter(x=>!p.items.includes(x.id));if(p.keys<CHEST||!left.length)return;
    p.keys-=CHEST;const it=pick(left);p.items.push(it.id);if(it.t==='hat')p.eq.hat=it.k;else p.eq[it.t]=it.id;save();setPreview();
    lobbyArg.got=it.id;renderLobby();voice([P.chest]);sfx([523,659,784,1047,1319],.09);burst(0,3,PZ,['#ff4f6e','#ffc824','#3fd0ff','#b9ff3c'],30)}
  else if(A==='gate')showLobby('gate');
  else if(A==='gateok'){if(+$('gAns').value===lobbyArg.ans)showLobby('set');else{toast('다시 해 봅시다.');showLobby('gate')}}
  else if(A==='learn'){S.set.learn[+b.dataset.g-1]=+b.dataset.u;save();renderLobby()}
  else if(A==='rounds'){S.set.rounds=+b.dataset.v;save();renderLobby()}
  else if(A==='time'){S.set.time=+b.dataset.v;save();renderLobby()}
  else if(A==='help'){S.set.help=+b.dataset.v;save();renderLobby()}
  else if(A==='del'){if(!armed('del'+i))return;S.profs.splice(i,1);S.cur=-1;save();renderLobby()}
  else if(A==='wipe'){if(!armed('wipe'))return;S.profs.forEach(q=>{q.st={};q.play=0;q.win=0;q.keys=CHEST;q.items=[];q.eq={hat:0,col:'',trail:''};const l=q.grade===1?1:2;q.lv=[l,l,l,l];q.arena=0});save();renderLobby()}
});
$('lobby').addEventListener('input',e=>{if(e.target.id==='lName'){const p=prof(),n=cleanName(e.target.value);if(n){p.name=n;save();if(preview)setTag(preview,n,TEAM[0])}}});
$('lobby').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gAns'){const b=$('lobby').querySelector('[data-a=gateok]');b&&b.click()}});
addEventListener('pointerdown',()=>audioInit(),{once:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){vStop();if(ac)ac.suspend()}else if(ac)ac.resume()});
addEventListener('pagehide',()=>{if(NET.room>=0)netLeave(true)});

/* ───────── 시작 ───────── */
function boot(){
  B.arena=prof()?prof().arena:0;buildArena(B.arena);layout();
  showLobby(prof()?'main':'who');
  if(TEST)window.__g={S,B,U,makeQ,speechList,startMatch,throwF,hitF,qAnswer,soundVars,NET,renderer,scene,camera,step(sec){for(let t=0;t<sec;t+=.05)battleTick(.05)},get preview(){return preview}};
  frame();
}
const ALLTEXT=[...new Set(document.documentElement.innerHTML.match(/[ㄱ-힣]/g)||[])].join('');
const fontWait=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load('40px Jua',ALLTEXT),new Promise(r=>setTimeout(r,4000))]):Promise.resolve();
fontWait.catch(()=>{}).then(boot);
</script>
